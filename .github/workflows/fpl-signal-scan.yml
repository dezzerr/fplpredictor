name: FPL signal scan

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Extract and verify signals without writing to Supabase
        type: boolean
        default: false
  schedule:
    # Every six hours in UTC. Add a deadline-specific schedule after the
    # first production scan is verified.
    - cron: '15 */6 * * *'

concurrency:
  group: fpl-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Immutable scanner release; main contains an older application.
          ref: 8945f5e8a0f155e08538770fb3b6a2ce825bea84
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan FPL news signals
        run: npm run signals:scan ${{ inputs.dry_run == true && '-- --dry-run' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
