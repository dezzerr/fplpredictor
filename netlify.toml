[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Disable secrets scanning - NEXT_PUBLIC keys are meant to be public
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."send-welcome-emails"]
  schedule = "*/5 * * * *"

[functions."fpl-data-health"]
  schedule = "15 7 * * *"

[functions."capture-player-usage"]
  schedule = "45 6 * * *"
